cargo-features = ["edition2024"]

[package]
name = "kaja-web-component"
version = "1.0.1"
edition = "2024"
description = "Web component framework for Rust targeting the WebAssembly"
license = "MIT"
repository = "https://github.com/johanmattssonm/kaja-web-component"
readme = "README.md"
keywords = ["html", "web", "component", "webassembly"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
gloo = "0.12.0"
wasm-bindgen = "0.2.122"
js-sys = "0.3"
web-sys = { version = "0.3.99", features = ["Window", "Document", "HtmlDocument", "Element", "HtmlElement", "HtmlInputElement", "NodeList", "CssStyleDeclaration", "DomTokenList", "MessageEvent", "CustomElementRegistry", "ElementDefinitionOptions"] }
inventory = "0.3.24"

[dev-dependencies]
gloo = "0.12.0"
gloo-console = "0.4.0"
wasm-bindgen = "0.2.122"

[patch.crates-io]
kaja-callback-macro = { path = "../kaja-callback-macro" }
